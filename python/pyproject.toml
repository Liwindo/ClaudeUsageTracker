[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-usage-monitor"
dynamic = ["version"]
description = "System-tray tool that monitors claude.ai usage limits via browser cookies"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pystray>=0.19.5",
    "Pillow>=12.3.0",
    "plyer>=2.1",
    "tomli-w>=1.2.0",
    "tzdata>=2026.5",
]

[project.scripts]
claude-usage-monitor = "claude_usage_monitor.__main__:main"

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

[tool.hatch.version]
path = "src/claude_usage_monitor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_usage_monitor"]

[tool.uv]
# The EXE's TLS fingerprint comes from the interpreter's bundled OpenSSL, and
# Cloudflare blocks some builds with 403 on claude.ai. .python-version pins the
# version; this pins the BUILD: always uv's own CPython, never a runner's
# toolcache Python of the same version (which uv would otherwise pick up).
python-preference = "only-managed"
