name: CPython 3.14.10 watch

# Temporary reminder for issue #46: the Python pin goes straight from 3.14.8
# to 3.14.10, together with release 2.3.2. 3.14.10 is out, but uv does not
# offer its Windows build yet. This job checks daily and comments on the issue
# once uv lists it, so the signal reaches every machine as a GitHub
# notification. Delete this file in the PR that bumps python/.python-version.

on:
  schedule:
    - cron: '17 6 * * *'   # daily
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    # Same platform as the build: uv lists only downloads for the runner's OS.
    runs-on: windows-latest
    steps:
      # Non-immutable action: pinned to a commit SHA (CodeQL supply-chain
      # hardening — tags can be moved, SHAs cannot). Dependabot bumps the SHA
      # and the trailing version marker; keep this comment version-free.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Comment on the issue once uv offers CPython 3.14.10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: '46'
          WANTED: '3.14.10'
        run: |
          set -euo pipefail
          found=$(uv python list "$WANTED" --only-downloads --output-format json | python -c "
          import json, sys
          print(any(x['implementation'] == 'cpython' and x['variant'] == 'default'
                    and x['version'] == sys.argv[1] for x in json.load(sys.stdin)))
          " "$WANTED")
          if [ "$found" != "True" ]; then
            echo "uv does not offer CPython $WANTED for Windows yet."
            exit 0
          fi
          marker="<!-- cpython-watch:$WANTED -->"
          if gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json comments \
               --jq '.comments[].body' | grep -qF "$marker"; then
            echo "Already reported on #$ISSUE."
            exit 0
          fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$marker
          @Liwindo uv now offers CPython $WANTED for Windows. Follow the steps above: bump the pin, delete this watch workflow, release 2.3.2."
          echo "Commented on #$ISSUE."
