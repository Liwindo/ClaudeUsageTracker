name: Shipped dependencies

# Tells GitHub's dependency graph what the latest published release actually
# ships, so Dependabot alerts describe the binaries users run instead of a
# restore on some CI runner. The portable C# EXE is self-contained: it bundles
# the win-x64 .NET and WindowsDesktop runtimes at the version of the SDK that
# built it, which neither static .csproj parsing nor automatic dependency
# submission can see. scripts/shipped_snapshot.py reads the .deps.json embedded
# in that EXE and files it as a snapshot for the default branch. Each published
# release replaces the previous snapshot, so an alert on a bundled component
# closes only once a fixed release is out - not when master merely builds with
# a newer SDK.
#
# Automatic dependency submission must stay OFF in the repository settings: it
# restores on ubuntu and would file its own linux-x64 snapshot next to this one.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to report (default: the latest published release)'
        required: false

permissions:
  contents: write   # POST /repos/{owner}/{repo}/dependency-graph/snapshots

concurrency:
  group: shipped-dependencies
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Submit the dependencies of the published release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as runtime values, never expanded into the script body — an
          # attacker-chosen tag can never be parsed as shell (expression
          # injection). They stay plain data.
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # The update check follows releases/latest, so that is what users run.
          # Re-publishing an older release must not roll the graph back to it.
          latest=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          tag="${RELEASE_TAG:-$latest}"
          if [ "$tag" != "$latest" ]; then
            echo "::notice::$tag is not the latest published release ($latest) - graph left unchanged."
            exit 0
          fi

          asset_dir="$RUNNER_TEMP/asset"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" \
            --pattern "ClaudeUsageTracker-Portable-*.exe" --dir "$asset_dir"
          exe="$asset_dir/ClaudeUsageTracker-Portable-${tag#v}.exe"
          [ -f "$exe" ] || { echo "::error::release $tag has no $(basename "$exe")"; exit 1; }

          # Alerts are computed for the default branch, so the snapshot is filed there.
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
          python3 scripts/shipped_snapshot.py --exe "$exe" --tag "$tag" \
            --sha "$sha" --ref "refs/heads/$DEFAULT_BRANCH" \
            --job-id "$GITHUB_RUN_ID" --job-url "$RUN_URL" \
            --output "$RUNNER_TEMP/snapshot.json"

          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            --input "$RUNNER_TEMP/snapshot.json" \
            --jq '"Snapshot \(.id): \(.result) - \(.message)"'
