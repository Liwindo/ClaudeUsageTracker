# .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: uv
    directory: "/python"
    schedule:
      interval: weekly
      day: monday
    groups:
      python-packages:
        patterns:
          - "*"
    ignore:
      - dependency-name: pyinstaller
        update-types: ["version-update:semver-major"]

  # NuGet bumps for the C# variant. ci-csharp.yml runs the xunit suite on
  # these PRs; its automerge job squash-merges patch/minor bumps once that
  # passes, majors (e.g. the Tomlyn 2.x migration) stay a manual review.
  - package-ecosystem: nuget
    directory: "/csharp"
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget-packages:
        patterns:
          - "*"

  # Keeps the SHA-pinned actions in ci.yml / release.yml current —
  # Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
